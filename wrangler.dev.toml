#:schema node_modules/wrangler/config-schema.json
#
# Local development only (`pnpm dev`). Every value here is a stand-in, and the
# deploy check refuses a config that looks like this one.
#
# /health and the OAuth metadata work as they are. Signing in against the
# local worker also needs a callback on a host you own: map a subdomain of
# your domain to 127.0.0.1 in /etc/hosts, put it in the two URLs below, serve
# with `pnpm dev --local-protocol https --port 8787`, and set
# APP_OIDC_CLIENT_ID to a broker client registered for
# https://<that host>:8787/oauth/callback. Raw localhost is deliberately not
# used, so an authorization code can never land on a host you do not own.
name = "stablecoin-manager-dev"
main = "./src/index.ts"
compatibility_date = "2026-05-12"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "development"
AUTH_PROVIDER = "app-oidc"
MCP_SERVER_BASE_URL = "https://dev.wallet.example.com:8787"
OAUTH_ISSUER = "https://dev.wallet.example.com:8787"
APP_OIDC_ISSUER = "https://app-oidc-api.s-kishi.workers.dev"
APP_OIDC_CLIENT_ID = "app_REPLACE_WITH_DEV_CLIENT_ID"
ALLOWED_GOOGLE_EMAILS = "owner@example.com"
JWT_EXPIRES_IN = "3600"
X402_HOST = "https://x402.erpc.global"
JWT_SECRET = "dummy-jwt-secret-local-only"
REFRESH_TOKEN_SECRET = "dummy-refresh-secret-local-only"
OAUTH_STATE_SECRET = "dummy-state-secret-local-only"
POLICY_MAX_EURC_PER_PAYMENT = "50"
POLICY_MAX_EURC_PER_DAY = "200"
POLICY_ALLOWED_NETWORKS = "eip155:8453,solana-mainnet"
POLICY_ALLOWED_ASSETS = "EURC,USDC"
POLICY_ALLOW_ANY_PAYTO = "false"
POLICY_MAX_SLIPPAGE_BPS = "50"
POLICY_MAX_DEADLINE_SECONDS = "600"

[[kv_namespaces]]
binding = "MCP_KV"
id = "PLACEHOLDER_KV_ID"
preview_id = "PLACEHOLDER_KV_PREVIEW_ID"

[[durable_objects.bindings]]
name = "WALLET_LEDGER"
class_name = "WalletLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletLedger"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
