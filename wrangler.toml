# HAND-MANAGED. This file is not generated by any config tool.
#
# The worker owns a Durable Object (WalletLedger) bound via `[[migrations]]`.
# A generic config generator is unlikely to have a schema for
# `durable_objects` / `new_sqlite_classes`, so regenerating this file from a
# higher-level manifest could silently drop the migration tag and orphan the
# ledger. Keep it hand-written.
#
# Production invariants (do not change without understanding why):
#   - migration tags: v1 (WalletLedger) -- tags are cumulative, never rewritten
#   - WALLET_MNEMONIC and ERPC_API_KEY are `wrangler secret` only. They must
#     never be added to this file's `[vars]`, so CI or a config generator
#     never carries them. `wrangler deploy` preserves existing secrets.
# 2026-05-12: the compatibility date chosen for the SQLite Durable Objects
# feature set supported by the pinned `wrangler`, so `wrangler dev --local`
# actually boots this worker.
name = "mcp-stablecoin-manager"
main = "./src/index.ts"
compatibility_date = "2026-05-12"
workers_dev = false
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
MCP_SERVER_BASE_URL = "https://mcp-stablecoin-manager.erpc.global"
OAUTH_ISSUER = "https://mcp-stablecoin-manager.erpc.global"
AUTH_API_BASE_URL = "https://auth-api.erpc.global"
AUTH_API_CLIENT_ID = "mcp-stablecoin-manager"
ALLOWED_GOOGLE_EMAILS = "owner@example.com"
JWT_EXPIRES_IN = "3600"
X402_HOST = "https://x402.erpc.global"
# Policy ceilings. Set here, per deploy. These are the DEPLOY-TIME ceiling.
#
# Runtime overrides may only TIGHTEN: `policy_set` writes
# a row with an audit entry, and the ledger composes it onto these values
# inside the same turn as each reservation. Raising a ceiling still means
# editing this file and redeploying -- different credentials, and it leaves a
# diff. The earlier version of this comment said no runtime override existed;
# that was true when it was written and is no longer true now that runtime
# overrides exist.
#
# 🔴 EVERY VALUE BELOW IS IDENTICAL TO THE BUILT-IN DEFAULT in lib/policy.ts.
# That is why "deploy, then exercise the happy path once" cannot tell you
# whether the worker is reading this file at all: an absent var does not
# throw, it falls back, and it falls back to exactly these numbers. If you
# need to know the Durable Object is reading [vars], change one of them to a
# value that differs from its default and observe the refusal boundary.
# `lib/reserve.test.ts` pins the equality, so the day one differs, it reddens.
POLICY_MAX_EURC_PER_PAYMENT = "50"
POLICY_MAX_EURC_PER_DAY = "200"
POLICY_ALLOWED_NETWORKS = "eip155:8453,solana-mainnet"
POLICY_ALLOWED_ASSETS = "EURC,USDC"
POLICY_ALLOW_ANY_PAYTO = "false"
POLICY_MAX_SLIPPAGE_BPS = "50"
POLICY_MAX_DEADLINE_SECONDS = "600"

[[routes]]
pattern = "mcp-stablecoin-manager.erpc.global"
custom_domain = true

[[kv_namespaces]]
binding = "MCP_KV"
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "WALLET_LEDGER"
class_name = "WalletLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletLedger"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
