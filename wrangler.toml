# `erpc app init --template` fills in the values in double braces below;
# `erpc deploy --target cloudflare` fills in the KV namespace id.
#
# compatibility_date 2026-05-12 is the date that gives this worker the SQLite
# Durable Object feature set supported by the pinned wrangler, so
# `wrangler dev --local` boots it.
name = "{{app.name}}"
main = "./src/index.ts"
compatibility_date = "2026-05-12"
workers_dev = false
compatibility_flags = ["nodejs_compat"]

[vars]
NODE_ENV = "production"
AUTH_PROVIDER = "app-oidc"
MCP_SERVER_BASE_URL = "{{MCP_SERVER_BASE_URL}}"
OAUTH_ISSUER = "{{OAUTH_ISSUER}}"
APP_OIDC_ISSUER = "{{APP_OIDC_ISSUER}}"
APP_OIDC_CLIENT_ID = "{{APP_OIDC_CLIENT_ID}}"
ALLOWED_GOOGLE_EMAILS = "{{ALLOWED_GOOGLE_EMAILS}}"
JWT_EXPIRES_IN = "3600"
X402_HOST = "https://x402.erpc.global"
# Policy ceilings: the deploy-time upper bound on what the agent may spend.
# `policy_set` can only tighten them at runtime; raising one means editing
# this file and redeploying. Every value here equals the built-in default in
# src/lib/policy.ts, so an absent var and a present one behave the same;
# src/lib/reserve.test.ts pins that equality.
POLICY_MAX_EURC_PER_PAYMENT = "50"
POLICY_MAX_EURC_PER_DAY = "200"
POLICY_ALLOWED_NETWORKS = "eip155:8453,solana-mainnet"
POLICY_ALLOWED_ASSETS = "EURC,USDC"
POLICY_ALLOW_ANY_PAYTO = "false"
POLICY_MAX_SLIPPAGE_BPS = "50"
POLICY_MAX_DEADLINE_SECONDS = "600"

# The wallet recovery phrase and the optional ERPC API key are Worker secrets
# as well, but they are deliberately left out of this list and out of [vars]:
# the deploy check refuses a config that names either of them.
[secrets]
required = ["JWT_SECRET", "REFRESH_TOKEN_SECRET", "OAUTH_STATE_SECRET"]

[[routes]]
pattern = "{{domain}}"
custom_domain = true

[[kv_namespaces]]
binding = "MCP_KV"
id = "{{erpc:kv-id:MCP_KV}}"

[[durable_objects.bindings]]
name = "WALLET_LEDGER"
class_name = "WalletLedger"

# Migration tags are cumulative. Never rewrite or drop v1: it would orphan the
# ledger.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["WalletLedger"]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1
